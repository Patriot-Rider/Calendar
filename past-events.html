<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patriot Riders WI-1 - Archived Events History</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        /* [Retain your existing style code here] */
        
        /* New utility styles for Admin controls inside Archives */
        .admin-archive-bar { display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 1rem; padding-top: 0.75rem; border-top: 1px dashed #cbd5e1; }
        .btn-edit { background-color: #fef9c3; color: #854d0e; border: 1px solid #fef08a; font-size: 0.75rem; padding: 0.5rem 0.875rem; border-radius: 0.25rem; font-weight: 600; cursor: pointer; text-decoration: none; }
        .btn-edit:hover { background-color: #fef08a; }
        .btn-delete { background-color: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; font-size: 0.75rem; padding: 0.5rem 0.875rem; border-radius: 0.25rem; font-weight: 600; cursor: pointer; }
        .btn-delete:hover { background-color: #fca5a5; }
        .badge-info { font-size: 0.75rem; color: #334155; font-weight: 600; background-color: #f1f5f9; padding: 0.25rem 0.5rem; border-radius: 0.25rem; border: 1px solid #e2e8f0; display: inline-block; margin-top: 0.25rem; }
        .badge-row-metrics { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.5rem; }
    </style>
</head>
<body>

    <nav>
        <div class="nav-container">
            <div class="nav-branding">
                <img src="PR Logo_2.jpg" alt="Logo" class="nav-logo" onerror="this.style.display='none'">
                <h1>Patriot Riders WI-1 Archives</h1>
            </div>
            <div>
                <a href="index.html" class="btn btn-slate">📅 Back To Live Calendar</a>
            </div>
        </div>
    </nav>

    <div class="max-container">
        <div class="header-block">
            <h2>📜 Historical Archived Events</h2>
            <p>Review of past runs, poker distributions, and metrics reports.</p>
        </div>

        <div id="filter-banner" class="filter-alert-banner hidden">
            <span id="filter-text-label">Filtering historical items...</span>
            <button onclick="clearQueryFilter()" class="btn-clear">Clear Filter</button>
        </div>

        <div id="archive-display-list" class="events-container">
            </div>
    </div>

    <script>
        // Set up real-time initialization configurations
        const firebaseConfig = {
            databaseURL: "https://patriot-riders-wi1-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let explicitUrlFilter = null;
        let isAdmin = false;

        window.addEventListener('DOMContentLoaded', () => {
            // Read authentication token computed by Dashboard Access controller from the main interface page
            isAdmin = localStorage.getItem('pr_admin_auth') === 'true';
            
            const urlParameters = new URLSearchParams(window.location.search);
            explicitUrlFilter = urlParameters.get('date');

            database.ref("events").on('value', (snapshot) => {
                const data = snapshot.val();
                let historicalArray = [];
                if (data) {
                    Object.keys(data).forEach(key => {
                        historicalArray.push({ id: key, ...data[key] });
                    });
                }
                processAndRenderArchive(historicalArray);
            });
        });

        function clearQueryFilter() {
            explicitUrlFilter = null;
            window.history.replaceState({}, document.title, window.location.pathname);
            document.getElementById('filter-banner').classList.add('hidden');
            
            database.ref("events").once('value', (snapshot) => {
                const data = snapshot.val();
                let historicalArray = [];
                if (data) {
                    Object.keys(data).forEach(key => historicalArray.push({ id: key, ...data[key] }));
                }
                processAndRenderArchive(historicalArray);
            });
        }

        function deleteArchiveEvent(id) {
            if (confirm("Permanently destroy this archive record entry from the database?")) {
                database.ref("events/" + id).remove();
            }
        }

        function editArchiveEvent(id) {
            // Signal main index calendar page to load this targeted layout model inside its control room panel
            localStorage.setItem('pr_edit_target_id', id);
            window.location.href = 'index.html';
        }

        function processAndRenderArchive(rawEvents) {
            const displayList = document.getElementById('archive-display-list');
            const banner = document.getElementById('filter-banner');
            const bannerTxt = document.getElementById('filter-text-label');
            
            displayList.innerHTML = '';
            
            const todayMidnight = new Date();
            todayMidnight.setHours(0,0,0,0);

            let workingArray = [];

            if (explicitUrlFilter) {
                banner.classList.remove('hidden');
                const parsedLabel = new Date(explicitUrlFilter + 'T00:00:00').toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
                bannerTxt.innerText = `Viewing archives matching target date: ${parsedLabel}`;
                
                workingArray = rawEvents.filter(e => {
                    const spans = getDatesInRange(e.date, e.endDate);
                    return spans.includes(explicitUrlFilter);
                });
            } else {
                banner.classList.add('hidden');
                workingArray = rawEvents.filter(e => {
                    const terminalDateStr = e.endDate ? e.endDate : e.date;
                    const terminalDate = new Date(terminalDateStr + 'T00:00:00');
                    return terminalDate < todayMidnight;
                });
            }

            // Newest past events display layout orientation at the top first
            workingArray.sort((a, b) => new Date(b.date + 'T00:00:00') - new Date(a.date + 'T00:00:00'));

            if (workingArray.length === 0) {
                displayList.innerHTML = `<div class="empty-state">No historical event archives available found matching selection parameters.</div>`;
                return;
            }

            workingArray.forEach(e => {
                let thumbMarkup = '🖼️';
                if (e.thumbnail) {
                    thumbMarkup = `<img src="${e.thumbnail}" class="thumb-zoom" alt="Thumbnail">`;
                }

                let formattedDate = new Date(e.date + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
                if (e.endDate) {
                    formattedDate += ` - ${new Date(e.endDate + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}`;
                }

                // Compile metrics badges
                let metricsMarkup = '<div class="badge-row-metrics">';
                if (e.time) metricsMarkup += `<span class="badge-info">⏰ ${e.time}</span> `;
                if (e.location) metricsMarkup += `<span class="badge-info">📍 ${e.location}</span> `;
                if (e.metricBikes) metricsMarkup += `<span class="badge-info" style="background-color: #f0fdf4; border-color: #bbf7d0;">🏍️ ${e.metricBikes} Vehicles</span> `;
                if (e.metricRaised) metricsMarkup += `<span class="badge-info" style="background-color: #fefce8; border-color: #fef08a; color: #854d0e;">💰 Raised: ${e.metricRaised}</span> `;
                if (e.metricFifty) metricsMarkup += `<span class="badge-info" style="background-color: #fef2f2; border-color: #fee2e2; color: #991b1b;">🎟️ 50/50: ${e.metricFifty}</span> `;
                if (e.metricAttended) metricsMarkup += `<span class="badge-info" style="background-color: #eff6ff; border-color: #bfdbfe; color: #1e40af;">👥 Attended: ${e.metricAttended}</span> `;
                metricsMarkup += '</div>';

                let attachmentsMarkup = '';
                if (e.attachments && e.attachments.length > 0) {
                    attachmentsMarkup = `
                        <div class="download-section">
                            <div class="download-title">Archived Document Assets</div>
                            <div class="download-grid">
                    `;
                    e.attachments.forEach((file, idx) => {
                        const fileLabel = file.name || `Attachment_${idx + 1}`;
                        const targetContentType = file.contentType || 'application/pdf';
                        attachmentsMarkup += `
                            <div class="attachment-btn-group">
                                <button onclick="openAttachmentWindow(\`${file.dataString}\`, \`${targetContentType}\`)" class="btn-view-doc">👁️ View ${fileLabel}</button>
                                <button onclick="downloadAttachmentFile(\`${file.dataString}\`, \`${fileLabel}\`, \`${targetContentType}\`)" class="btn-download-doc">📥 Save</button>
                            </div>
                        `;
                    });
                    attachmentsMarkup += `</div></div>`;
                }

                // If admin is authenticated via the control room dashboard, build the modification layout tools bar
                let adminBarMarkup = '';
                if (isAdmin) {
                    adminBarMarkup = `
                        <div class="admin-archive-bar">
                            <button onclick="editArchiveEvent('${e.id}')" class="btn-edit">✏️ Edit Event Details</button>
                            <button onclick="deleteArchiveEvent('${e.id}')" class="btn-delete">🗑️ Delete Archive Record</button>
                        </div>
                    `;
                }

                const elementMarkup = `
                    <div class="event-card">
                        <div class="card-meta-row">
                            <div>${thumbMarkup}</div>
                            <div class="meta-details">
                                <span class="badge-date">${formattedDate}</span>
                                <h3 class="event-title">${e.title}</h3>
                                ${metricsMarkup}
                            </div>
                        </div>
                        ${e.description ? `<div class="event-desc">${e.description}</div>` : ''}
                        ${attachmentsMarkup}
                        ${adminBarMarkup}
                    </div>
                `;
                displayList.innerHTML += elementMarkup;
            });
        }

        function getDatesInRange(start, end) {
            const dates = [];
            if (!start) return dates;
            let current = new Date(start + 'T00:00:00');
            const endLimit = end ? new Date(end + 'T00:00:00') : current;
            while (current <= endLimit) {
                const y = current.getFullYear();
                const m = String(current.getMonth() + 1).padStart(2, '0');
                const d = String(current.getDate()).padStart(2, '0');
                dates.push(`${y}-${m}-${d}`);
                current.setDate(current.getDate() + 1);
            }
            return dates;
        }

        function openAttachmentWindow(base64DataStr, explicitType) {
            try {
                const splitData = base64DataStr.split(',');
                const byteStrings = atob(splitData[1]);
                const mimeString = explicitType || splitData[0].split(':')[1].split(';')[0];
                const arrayBuffer = new ArrayBuffer(byteStrings.length);
                const uint8Array = new Uint8Array(arrayBuffer);
                for (let i = 0; i < byteStrings.length; i++) { uint8Array[i] = byteStrings.charCodeAt(i); }
                const fileBlob = new Blob([arrayBuffer], { type: mimeString });
                const transientUrl = URL.createObjectURL(fileBlob);
                if (mimeString.toLowerCase().includes('pdf')) {
                    const trackingAnchor = document.createElement('a');
                    trackingAnchor.href = transientUrl;
                    trackingAnchor.target = '_blank';
                    document.body.appendChild(trackingAnchor);
                    trackingAnchor.click();
                    document.body.removeChild(trackingAnchor);
                } else {
                    window.open(transientUrl, '_blank');
                }
            } catch (err) { window.open(base64DataStr, '_blank'); }
        }

        function downloadAttachmentFile(base64DataStr, filename, explicitType) {
            try {
                const splitData = base64DataStr.split(',');
                const byteStrings = atob(splitData[1]);
                const mimeString = explicitType || splitData[0].split(':')[1].split(';')[0];
                const arrayBuffer = new ArrayBuffer(byteStrings.length);
                const uint8Array = new Uint8Array(arrayBuffer);
                for (let i = 0; i < byteStrings.length; i++) { uint8Array[i] = byteStrings.charCodeAt(i); }
                const fileBlob = new Blob([arrayBuffer], { type: mimeString });
                const transientUrl = URL.createObjectURL(fileBlob);
                const downloadAnchor = document.createElement('a');
                downloadAnchor.href = transientUrl;
                downloadAnchor.download = filename || "attachment";
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                document.body.removeChild(downloadAnchor);
                setTimeout(() => URL.revokeObjectURL(transientUrl), 250);
            } catch (err) { alert("Unable to handle automatic file download."); }
        }
    </script>
</body>
</html>
